[package]
name = "crunchyroll-downloader"
version = "0.1.0"
edition = "2024"
description = "Download Crunchyroll episodes to MKV"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
# Crunchyroll serves its artwork as JPEG, with WebP and PNG turning up here and there.
# The rest of the decoders are megabytes of binary for formats no CDN will ever send.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
indicatif = "0.18"
libc = "0.2"
once_cell = "1.21"
quick-xml = { version = "0.38", features = ["serialize"] }
ratatui = "0.30.2"
# The default features pull in libchafa, which has to be installed on the machine that
# builds and on the machine that runs. Its halfblock rendering is nicer than the one
# built in, but not at the price of a C library between the user and `cargo install`.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
regex = "1.11"
# http2 is not optional: without it reqwest offers only http/1.1 in the TLS handshake,
# and Cloudflare challenges a request that claims a Firefox user agent but never speaks
# HTTP/2 the way a browser would.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1.17", features = ["v4"] }
widevine = "0.1"
