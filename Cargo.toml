[package]
name = "crunchyroll-downloader"
version = "0.1.0"
edition = "2024"
description = "Download Crunchyroll episodes to MKV"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
indicatif = "0.18"
libc = "0.2"
once_cell = "1.21"
quick-xml = { version = "0.38", features = ["serialize"] }
ratatui = "0.30.2"
regex = "1.11"
# http2 is not optional: without it reqwest offers only http/1.1 in the TLS handshake,
# and Cloudflare challenges a request that claims a Firefox user agent but never speaks
# HTTP/2 the way a browser would.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
uuid = { version = "1.17", features = ["v4"] }
widevine = "0.1"
